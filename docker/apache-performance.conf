# Nuahn Seasonal Hub: compression and browser caching

ServerTokens Prod
ServerSignature Off

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json font/ttf
</IfModule>

AddType application/manifest+json .webmanifest
AddType font/woff2 .woff2

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType text/javascript "access plus 1 year"
  ExpiresByType image/svg+xml "access plus 1 year"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType image/webp "access plus 30 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/jpeg "access plus 30 days"
  ExpiresByType image/x-icon "access plus 30 days"
  ExpiresByType application/manifest+json "access plus 1 day"
</IfModule>

<IfModule mod_headers.c>
  # Versioned assets (?v=hash) never change: let browsers keep them.
  <LocationMatch "^/(public/assets|assets)/">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </LocationMatch>
  <FilesMatch "\.(woff2)$">
    Header set Access-Control-Allow-Origin "*"
  </FilesMatch>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Uploaded job images
<Directory /var/www/html/uploads>
  Options -Indexes
</Directory>

# Never serve the seed database, build files or deploy config over HTTP
<DirectoryMatch "^/var/www/html/(database|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^Dockerfile|^docker-entrypoint\.sh|^fly\.toml|\.sql)$">
    Require all denied
</FilesMatch>

; Production PHP settings for Nuahn Seasonal Hub
; Buffer output so header() redirects still work after the page shell has been echoed.
output_buffering = On
; Never print warnings/notices into pages; log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
; Compiled-script cache for faster responses
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
